<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Shield</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&family=Frank+Ruhl+Libre:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0f172a; --ink-2:#5b6478; --paper:#f4f5fb; --card:#ffffff; --line:#e6e8f1;
  --acc:#5b4bf5; --acc-soft:#eeecff;
  --ok:#0e9f6e; --ok-soft:#e2f7ee; --wait:#c27803; --wait-soft:#fff3d6; --no:#e0364f; --no-soft:#fde7eb; --hi:#ea6a12;
  --bubble-me:#e9e6ff; --bubble-them:#ffffff;
  --grad:linear-gradient(135deg,#6d5dfc 0%,#4f7cff 55%,#14b8d4 100%);
  --shadow:0 1px 2px rgba(15,23,42,.04),0 10px 30px -14px rgba(15,23,42,.18);
  --glass:rgba(255,255,255,.8);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --ink:#e8eaf4; --ink-2:#9aa3ba; --paper:#0a0c16; --card:#131728; --line:#242a42;
  --acc:#8f84ff; --acc-soft:#221e4a;
  --ok:#34d399; --ok-soft:#0d2a21; --wait:#fbbf24; --wait-soft:#2c230d; --no:#fb7185; --no-soft:#30121b; --hi:#fb923c;
  --bubble-me:#272259; --bubble-them:#1b2036;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px -16px rgba(0,0,0,.6); --glass:rgba(19,23,40,.8); color-scheme:dark; } }
:root[data-theme="dark"]{
  --ink:#e8eaf4; --ink-2:#9aa3ba; --paper:#0a0c16; --card:#131728; --line:#242a42;
  --acc:#8f84ff; --acc-soft:#221e4a;
  --ok:#34d399; --ok-soft:#0d2a21; --wait:#fbbf24; --wait-soft:#2c230d; --no:#fb7185; --no-soft:#30121b; --hi:#fb923c;
  --bubble-me:#272259; --bubble-them:#1b2036;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px -16px rgba(0,0,0,.6); --glass:rgba(19,23,40,.8); color-scheme:dark; }
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font-family:"Heebo",system-ui,"Segoe UI",Arial,sans-serif;font-size:16px;line-height:1.55;
  background:radial-gradient(1100px 480px at 85% -10%,color-mix(in srgb,var(--acc) 12%,transparent),transparent 60%),radial-gradient(900px 400px at 0% 0%,color-mix(in srgb,#14b8d4 9%,transparent),transparent 60%),var(--paper);background-attachment:fixed;
  padding-bottom:env(safe-area-inset-bottom,0px)}
h1,h2,h3{font-weight:800;letter-spacing:-.015em;margin:0;line-height:1.2}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding:0 16px}
[hidden]{display:none!important}

/* header */
header{position:sticky;top:0;z-index:20;background:var(--glass);backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top{display:flex;align-items:center;gap:18px;padding:12px 0;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand h1{font-size:26px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand span{color:var(--ink-2);font-size:14px}
nav.steps{display:flex;gap:2px;margin-inline-start:auto;flex-wrap:wrap;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:4px}
nav.steps button{border:0;background:none;border-radius:999px;padding:7px 14px;font-weight:600;font-size:15px;color:var(--ink-2);display:flex;gap:6px;align-items:center}
nav.steps button:hover{color:var(--ink)}
nav.steps button[aria-current="page"]{background:var(--card);color:var(--acc);box-shadow:var(--shadow)}
.badge{background:var(--no);color:#fff;border-radius:20px;font-size:12px;padding:0 7px;font-weight:700}
.modesw{border:1.5px solid var(--acc);background:var(--card);color:var(--acc);border-radius:999px;padding:6px 14px;font-weight:700;font-size:14px}
main{padding:24px 0 70px}

/* basics */
.title{font-size:clamp(26px,3.4vw,36px)}
.lede{max-width:70ch;color:var(--ink-2);margin:6px 0 20px;font-size:16.5px}
.note{font-size:14px;color:var(--ink-2)}
.btn{border:0;border-radius:12px;padding:10px 18px;background:var(--grad);color:#fff;font-weight:700;box-shadow:0 6px 18px -8px color-mix(in srgb,var(--acc) 70%,transparent);transition:transform .12s,filter .12s}
.btn:hover:not(:disabled){transform:translateY(-1px);filter:brightness(1.05)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:var(--card);color:var(--acc);border:1.5px solid color-mix(in srgb,var(--acc) 35%,var(--line));box-shadow:none}
.btn.sm{padding:5px 12px;font-size:14px;border-radius:9px}
.btn.big{padding:13px 24px;font-size:17px}
.btn.stop{background:var(--no);box-shadow:none}
.btn.go{background:var(--ok);box-shadow:none}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 13px;text-align:start;font-size:14px}
.chip:hover{background:var(--acc-soft)}
.chip.danger{border-color:color-mix(in srgb,var(--no) 40%,var(--line));color:var(--no)}
.chip.danger:hover{background:var(--no-soft)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;padding:2px 10px;border-radius:999px;background:var(--paper);border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}.pill.wait{background:var(--wait-soft);color:var(--wait);border-color:transparent}.pill.no{background:var(--no-soft);color:var(--no);border-color:transparent}.pill.acc{background:var(--acc-soft);color:var(--acc);border-color:transparent}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:18px 20px;min-width:0}
.card h3{font-size:18px;margin-bottom:10px}
.card+.card{margin-top:16px}
.empty{color:var(--ink-2);font-size:14.5px;padding:6px 0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.cols2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:4px 0 22px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:14px 16px}
.kpi b{display:block;font-size:30px;font-weight:800;line-height:1.1}
.kpi small{color:var(--ink-2);font-size:14px}
.kpi.ok b{color:var(--ok)}.kpi.wait b{color:var(--wait)}.kpi.no b{color:var(--no)}.kpi.acc b{color:var(--acc)}
input.inp,textarea.inp,select.inp{border:1px solid var(--line);border-radius:12px;padding:9px 12px;background:var(--paper);width:100%}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--paper);flex:none}
.seg button{border:0;background:none;padding:6px 13px;font-size:14px;color:var(--ink-2)}
.seg button+button{border-inline-start:1px solid var(--line)}
.seg button[aria-pressed="true"][data-d="allow"]{background:var(--ok-soft);color:var(--ok);font-weight:700}
.seg button[aria-pressed="true"][data-d="approve"]{background:var(--wait-soft);color:var(--wait);font-weight:700}
.seg button[aria-pressed="true"][data-d="deny"]{background:var(--no-soft);color:var(--no);font-weight:700}
.seg button:disabled{opacity:.4;cursor:not-allowed}
.thr{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink-2);margin-top:6px}
.thr input{width:90px;border:1px solid var(--line);border-radius:9px;padding:4px 8px;background:var(--paper)}

/* clients dashboard */
.ccards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.ccard{display:flex;flex-direction:column;gap:10px}
.ccard .hd{display:flex;gap:12px;align-items:center}
.ccard .hd h3{flex:1;font-size:19px;margin:0}
.ccard .st{display:flex;gap:14px;font-size:14px;color:var(--ink-2)}
.ccard .st b{color:var(--ink);font-size:16px}
.ring{--p:0;--gc:var(--ok);width:52px;height:52px;border-radius:50%;flex:none;display:grid;place-items:center;background:conic-gradient(var(--gc) calc(var(--p)*1%),var(--line) 0)}
.ring>span{width:40px;height:40px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-weight:800;font-size:14px}
.ring.big{width:104px;height:104px}.ring.big>span{width:80px;height:80px;font-size:28px;flex-direction:column;display:flex;justify-content:center}
.ring.big small{font-size:11px;color:var(--ink-2);font-weight:500}
.ring[data-l="wait"]{--gc:var(--wait)}.ring[data-l="no"]{--gc:var(--no)}
.newcard{display:grid;place-items:center;text-align:center;border:2px dashed color-mix(in srgb,var(--acc) 35%,var(--line));background:transparent;box-shadow:none;min-height:180px;color:var(--acc);font-weight:700;font-size:17px}
.alist .al{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer}
.alist .al:last-child{border-bottom:0}

/* wizard */
.wiz{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:20px;align-items:start}
.wiz aside{position:sticky;top:84px}
.step{display:flex;gap:14px}
.step .num{width:32px;height:32px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
.step .body{flex:1;min-width:0}
.step h3{margin:4px 0 4px}
.line-in{display:flex;gap:8px;margin-top:10px}
.line-in input{flex:1;font-size:17px;padding:12px 14px;border-radius:14px}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.tagf{display:flex;align-items:center;gap:6px;background:var(--acc-soft);border-radius:999px;padding:4px 6px 4px 12px;font-size:14px}
.tagf label{color:var(--acc);font-weight:700}
.tagf input,.tagf select{border:0;background:var(--card);border-radius:999px;padding:4px 10px;min-width:0;width:auto}
.tasks{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:10px;margin-top:12px}
.task{border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:12px 13px;text-align:start;display:flex;flex-direction:column;gap:4px;transition:all .12s}
.task b{font-size:15px}
.task .d{font-size:13px;color:var(--ink-2)}
.task .m{display:flex;justify-content:space-between;font-size:12.5px;margin-top:2px}
.task[aria-pressed="true"]{border-color:var(--acc);background:var(--acc-soft);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 18%,transparent)}
.kind{font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px}
.kind.customer{background:var(--ok-soft);color:var(--ok)}.kind.team{background:var(--wait-soft);color:var(--wait)}.kind.org{background:var(--acc-soft);color:var(--acc)}
.qrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.qrow:last-child{border-bottom:0}
.qrow .q{font-weight:600}
.chans{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.chans button[aria-pressed="true"]{background:var(--acc);color:#fff;border-color:var(--acc)}
.pv-emp{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:10px}
.pv-emp h4{margin:0 0 4px;font-size:16px}
.pv-emp ul{margin:4px 0 0;padding-inline-start:18px;font-size:14px}
.pv-sum{display:flex;gap:18px;margin-top:10px}
.pv-sum b{display:block;font-size:26px;font-weight:800;color:var(--acc);line-height:1.1}
.pv-sum small{font-size:13px;color:var(--ink-2)}

/* client view */
.chead{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.crumb{background:none;border:0;color:var(--acc);font-weight:700;padding:0;margin-bottom:6px}
.tabs{display:flex;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px;margin-bottom:18px;width:max-content;max-width:100%;overflow-x:auto}
.tabs button{border:0;background:none;border-radius:999px;padding:7px 16px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--acc);color:#fff}
.emps{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.emps button{border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:8px 14px;text-align:start}
.emps button[aria-pressed="true"]{border-color:var(--acc);background:var(--acc-soft)}
.live{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
.phone{background:var(--card);border:1px solid var(--line);border-radius:28px;display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow)}
.phone-top{padding:13px 18px;background:var(--grad);color:#fff;display:flex;justify-content:space-between;align-items:center;gap:10px}
.phone-top small{opacity:.85;font-size:13px;display:block}
.newchat{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600}
.clog{background:var(--paper);padding:16px;display:flex;flex-direction:column;gap:9px;height:390px;overflow-y:auto}
.msg{max-width:84%;padding:9px 13px;border-radius:18px;white-space:pre-wrap;word-wrap:break-word;box-shadow:0 1px 1px rgba(15,23,42,.05)}
.msg.in{background:var(--bubble-me);align-self:flex-end;border-start-end-radius:5px}
.msg.out{background:var(--bubble-them);align-self:flex-start;border-start-start-radius:5px}
.msg.sys{align-self:center;background:none;box-shadow:none;color:var(--ink-2);font-size:13px;padding:2px}
.presets{display:flex;gap:6px;flex-wrap:wrap;padding:10px 12px 0}
.presets .lbl{font-size:12.5px;color:var(--ink-2);font-weight:600;align-self:center}
.composer{display:flex;gap:8px;padding:12px}
.composer textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:14px;padding:9px 12px;background:var(--paper);min-height:44px;max-height:130px}
.thinking::after{content:"…";animation:dots 1.2s steps(3,end) infinite}
@keyframes dots{0%{content:"."}33%{content:".."}66%{content:"..."}}
.pend-item{border:1.5px solid var(--wait);background:var(--wait-soft);border-radius:14px;padding:11px 13px;margin-bottom:10px}
.pend-item b{display:block}
.logl{display:flex;flex-direction:column;max-height:420px;overflow-y:auto}
.lr{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14.5px;align-items:start}
.lr:last-child{border-bottom:0}
.lr time{color:var(--ink-2);font-size:12.5px}
.lr .sub{color:var(--ink-2);font-size:13px}
.tag{font-size:12px;font-weight:700;padding:1px 9px;border-radius:999px;white-space:nowrap}
.tag.allow{background:var(--ok-soft);color:var(--ok)}.tag.approve{background:var(--wait-soft);color:var(--wait)}.tag.deny{background:var(--no-soft);color:var(--no)}.tag.info{background:var(--acc-soft);color:var(--acc)}.tag.alert{background:var(--no);color:#fff}
.rl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.rl:last-child{border-bottom:0}
.rl .why{grid-column:1/-1;font-size:13px;color:var(--ink-2)}
.rl .thr{grid-column:1/-1}
.klist{list-style:none;padding:0;margin:0 0 10px;display:flex;flex-direction:column;gap:6px;max-height:240px;overflow-y:auto}
.klist li{display:flex;gap:8px;justify-content:space-between;background:var(--paper);border-radius:10px;padding:7px 10px;font-size:14.5px}
.klist button{background:none;border:0;color:var(--ink-2);font-size:18px;line-height:1}
.sugg{border:1.5px solid var(--acc);background:var(--acc-soft);border-radius:14px;padding:11px 13px;margin-bottom:10px}
.mini{width:100%;border-collapse:collapse;font-size:14px}
.mini th,.mini td{text-align:start;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.mini th{color:var(--ink-2);font-weight:600;font-size:13px}
.mini tr:last-child td{border-bottom:0}

/* security */
.sec-top{display:grid;grid-template-columns:minmax(0,2fr) repeat(3,minmax(0,1fr));gap:14px;margin-bottom:20px}
.risk{display:flex;gap:18px;align-items:center}
.alert{border:1px solid var(--line);border-inline-start:4px solid var(--ink-2);border-radius:12px;padding:10px 13px;margin-bottom:10px;background:var(--card)}
.alert.sev-crit{border-inline-start-color:var(--no);background:color-mix(in srgb,var(--no-soft) 60%,var(--card))}
.alert.sev-high{border-inline-start-color:var(--hi)}.alert.sev-med{border-inline-start-color:var(--wait)}
.alert.done{opacity:.55;background:var(--card)}
.alert .h{display:flex;gap:9px;align-items:center}.alert .h b{flex:1}
.alert time{font-size:12.5px;color:var(--ink-2)}
.sev{font-size:12px;font-weight:700;padding:1px 9px;border-radius:999px;background:var(--paper);white-space:nowrap}
.sev.crit{background:var(--no);color:#fff}.sev.high{background:var(--hi);color:#fff}.sev.med{background:var(--wait-soft);color:var(--wait)}
.alert .f{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:6px}
.alert .act{font-size:13.5px;font-weight:600;color:var(--acc)}
.an{display:grid;grid-template-columns:130px minmax(0,1fr);gap:2px 12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.an .note{grid-column:2}
.sr{padding:11px 0;border-bottom:1px solid var(--line)}
.seccat{font-size:12.5px;font-weight:700;color:var(--acc);background:var(--acc-soft);border-radius:8px;padding:4px 10px;margin:14px 0 2px}
.sr:last-child{border-bottom:0}
.switch{position:relative;width:44px;height:26px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.switch input:disabled{cursor:not-allowed}
.switch span{position:absolute;inset:0;border-radius:999px;background:var(--line);transition:background .15s}
.switch span::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.switch input:checked+span{background:var(--ok)}
.switch input:checked+span::after{transform:translateX(-18px)}
.switch input:focus-visible+span{outline:3px solid var(--acc);outline-offset:2px}

/* proxy */
.layers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:18px}
.layer{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;position:relative;box-shadow:var(--shadow)}
.layer .n{font-size:12px;color:var(--ink-2);font-weight:700}
.layer b{display:block;font-size:15px}
.layer .c{font-size:22px;font-weight:800;color:var(--no)}
.layer .c.ok{color:var(--ok)}
.traffic{width:100%;border-collapse:collapse;font-size:14px}
.traffic th,.traffic td{text-align:start;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.traffic th{font-size:12.5px;color:var(--ink-2);font-weight:600;position:sticky;top:0;background:var(--card)}
.tbox{max-height:520px;overflow:auto}

/* live demo: hub, employee app, admin, phone */
body.kiosk header{display:none}
body.kiosk main{padding:0;max-width:none}
.kexit{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));inset-inline-end:10px;z-index:60;background:rgba(15,23,42,.5);color:#fff;border:0;border-radius:999px;width:34px;height:34px;font-size:15px;opacity:.5}
.kexit:hover,.kexit:focus-visible{opacity:1}
.hub{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.hubc{display:flex;flex-direction:column}.hubc .btn{margin-top:auto;align-self:flex-start}
.hubi{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:26px;margin-bottom:10px}
.hubi.e{background:#ccfbf1}.hubi.a{background:var(--acc-soft)}.hubi.p{background:#e0e7ff}
.eapp{--co:#0f766e;max-width:960px;margin:18px auto;background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);display:flex;flex-direction:column;height:calc(100vh - 36px);height:calc(100dvh - 36px);overflow:hidden}

function mask(c,text){const hits=[];

// Outbound data check (DLP): find Israeli IDs (checksum) and card numbers (Luhn) in anything leaving the org

const CARD_RE=/(?<![\d.])(?:\d[ -]?){11,18}\d(?![\d.])/g;
const SCI_RE=/(?<![\d.])\d\.\d{4,}E\+1[1-8](?![\d])/gi;   // long numbers as spreadsheets store them (4.58007E+15)

const ID_KEY=/ת[.״"']?\s?ז|תעודת\s+זהות|מספר\s+זהות|\bID\b/i;
const ID_RE=/(?<![\d.-])(?:\d{9}|\d{8}-\d|\d{3}[ -]\d{3}[ -]\d{3})(?![\d.-])/g;

// strict redaction for logs, audit and the chat history: sensitive values are never stored, even when blocked
function maskStrict(s){s=String(s);const ck=CARD_KEY.test(s),ik=ID_KEY.test(s);

function extraFindings(c,tool,p){

/* ================= THE PROXY: every action of every AI employee passes here ================= */

function layerPolicy(c,emp,tool,params,d){

function layerAnomaly(c,tool,params,d){

  if(d.decision==="allow"){c.stats.auto++;bump(c,tool,"a");logc(c,"allow",what,d.reason);const r=execute(c,emp,tool,p);audit(c,"executed",{tool});save();return Object.assign({status:"executed"},r);}

function suggestions(c){
  const out=[];
  c.employees.forEach(emp=>emp.rules.forEach(rule=>{
    const T=TOOLS[rule.tool], ds=c.decisions.filter(d=>d.tool===rule.tool&&d.emp===emp.id), yes=ds.filter(d=>d.ok), no=ds.filter(d=>!d.ok);
    if(rule.decision==="approve"&&T.param&&yes.length>=2&&!no.length){const mx=Math.max(...yes.map(d=>d.value));if(!rule.autoUpTo||mx>rule.autoUpTo){
      const id=`raise:${emp.id}:${rule.tool}:${mx}`;if(!c.dismissed.includes(id))out.push({id,text:`אישרת ${yes.length} פעמים ${T.label} עד ${fmtN(mx)}${T.unit}, ולא דחית. לאפשר ל${emp.name} לבד עד ${fmtN(mx)}${T.unit}?`,apply:()=>setRule(c,emp,rule,{autoUpTo:mx},"הצעת למידה")});}}
    if(rule.decision==="approve"&&no.length>=2&&!yes.length){const id=`deny:${emp.id}:${rule.tool}:${no.length}`;if(!c.dismissed.includes(id))out.push({id,text:`דחית ${no.length} פעמים ${T.label}. לחסום את זה ל${emp.name}?`,apply:()=>setRule(c,emp,rule,{decision:"deny"},"הצעת למידה")});}
  }));
  return out;
}
function ruleText(r){const T=TOOLS[r.tool];return DEC_HE[r.decision]+(r.decision==="approve"&&r.autoUpTo?` (עד ${r.autoUpTo}${T.unit} לבד)`:"");}

  const to=ruleText(rule);if(from!==to){c.history.unshift({at:nowT(),emp:emp.name,tool:rule.tool,from,to,by});audit(c,"rule_changed",{emp:emp.name,tool:rule.tool,from,to,by});logc(c,"info",`${emp.name}: ${TOOLS[rule.tool].label}`,`${from} ← ${to} (${by})`);}save();}

}
